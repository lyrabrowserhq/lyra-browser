name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate layout and policies
        run: python3 scripts/validate.py

      - name: Test release signing
        run: python3 scripts/test_release_sign.py

      - name: Python syntax check
        run: python3 -m compileall -q scripts branding

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh extensions/ublock/fetch.sh
